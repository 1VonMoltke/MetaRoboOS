[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaos-libero-device"
version = "0.1.0"
description = "Independent LIBERO-Pro native HTTP/container device adapter"
requires-python = ">=3.10,<3.13"
dependencies = ["metaos-contracts>=0.2,<0.3", "roborsi-sdk>=1,<2", "jsonschema>=4.18"]

[project.entry-points."roborsi.components"]
"environment.libero_device" = "metaos_libero_device:provider"

[tool.setuptools.packages.find]
where = ["src"]
