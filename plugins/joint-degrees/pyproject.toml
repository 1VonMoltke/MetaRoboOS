[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaos-joint-degrees"
version = "0.1.0"
description = "Explicit bounded degrees-to-radians device adapter"
requires-python = ">=3.10,<3.13"
dependencies = ["metaos-contracts>=0.2,<0.3", "roborsi-sdk>=1,<2", "jsonschema>=4.18"]

[project.entry-points."roborsi.components"]
"embodiment.joint_degrees" = "metaos_joint_degrees:provider"

[tool.setuptools.packages.find]
where = ["src"]
