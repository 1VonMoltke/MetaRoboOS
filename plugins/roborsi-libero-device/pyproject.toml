[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "metaos-roborsi-libero-device"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["metaos-contracts>=0.2,<0.3", "roborsi-sdk>=1,<2", "jsonschema>=4.18"]
[project.entry-points."roborsi.components"]
"environment.roborsi_libero_device" = "metaos_roborsi_libero_device:provider"
[tool.setuptools.packages.find]
where = ["src"]
