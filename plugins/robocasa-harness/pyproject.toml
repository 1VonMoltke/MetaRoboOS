[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaos-robocasa-harness"
version = "0.1.0"
description = "Original RoboRSI CaseRunner and Agent protocol over the MetaRoboOS gateway"
requires-python = ">=3.10,<3.13"
dependencies = ["metaos-runtime>=0.2,<0.3", "roborsi[runtime]>=0.1,<0.2"]

[project.scripts]
metaos-robocasa-harness = "metaos_robocasa_harness:main"
metaos-robocasa-agent = "metaos_robocasa_harness.agent_service:main"

[tool.setuptools.packages.find]
where = ["src"]
