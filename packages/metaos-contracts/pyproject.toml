[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaos-contracts"
version = "0.2.0"
description = "P0 resource, command, lease and device contracts for MetaRoboOS"
requires-python = ">=3.10,<3.13"
dependencies = ["roborsi-sdk>=1,<2", "pydantic>=2,<3", "jsonschema>=4.18"]

[tool.setuptools.packages.find]
where = ["src"]
