[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaos-runtime"
version = "0.2.0"
description = "Benchmark-independent P0 component graph and device command gateway"
requires-python = ">=3.10,<3.13"
dependencies = ["metaos-contracts>=0.2,<0.3", "roborsi-sdk>=1,<2", "PyYAML>=6,<7", "jsonschema>=4.18", "packaging>=23"]

[project.scripts]
metaos = "metaos_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
