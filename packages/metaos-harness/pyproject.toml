[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metaos-harness"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
description = "Lightweight typed Harness component graph and lifecycle"
dependencies = ["jsonschema>=4.18", "PyYAML>=6", "packaging>=23"]

[project.scripts]
metaos-harness = "metaos_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
